<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090711">
<meta name="robots" content="noindex,nofollow">
<title>ZGTHUB — Karbantartás</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f8f5ff;background:radial-gradient(ellipse at 50% 0%,#4c1d9560,transparent 48%),radial-gradient(ellipse at 100% 100%,#17255455,transparent 42%),#090711}
main{width:min(680px,100%);padding:clamp(28px,6vw,54px);border:1px solid #a855f755;border-radius:26px;background:linear-gradient(145deg,#171221f2,#0e0b16f5);box-shadow:0 28px 90px #0008;text-align:center}
.logo{width:58px;height:58px;margin:0 auto 24px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#c084fc,#6d28d9);font-size:30px;font-weight:1000;box-shadow:0 0 36px #9333ea55}
.tag{color:#c4a5fd;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
h1{margin:14px 0 20px;font-size:clamp(27px,5vw,42px);line-height:1.12;letter-spacing:-.04em}
p{margin:12px 0;color:#c8bdd8;font-size:16px;line-height:1.75}
strong{color:#fff}
.heart{margin-top:26px;color:#d8b4fe;font-weight:800}
</style>
</head>
<body>
<main>
<div class="logo">Z</div>
<div class="tag">ZGT TEAM · ZGTHUB</div>
<h1>🔧 A SZERVER JELENLEG NEM ELÉRHETŐ</h1>
<p>A ZGTHUB szervere jelenleg karbantartás vagy hiba miatt nem működik.</p>
<p><strong>Várhatóan néhány perc, óra vagy nap múlva újra elérhető lesz!</strong></p>
<p>Köszönjük a türelmeteket! 💜</p>
<div class="heart">— ZGT Team</div>
</main>
</body>
</html>
