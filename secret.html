<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08070b"><title>Secret unlocked · ZGTHUB</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#39205b,#08070b 60%);color:#f8f5ff;font:16px/1.6 system-ui,sans-serif;text-align:center}main{width:min(620px,100%);padding:36px 24px;border:1px solid #9b5de5;border-radius:18px;background:#111014;box-shadow:0 20px 70px #0009}.eyebrow{color:#c4a0f3;font-weight:900;letter-spacing:.18em;font-size:12px}h1{font-size:clamp(32px,8vw,54px);margin:12px 0}.code{display:block;width:100%;margin:22px auto;padding:17px 14px;border:1px solid #b78be9;border-radius:9px;background:#08070b;color:#e5ccff;font:900 clamp(18px,5vw,26px) ui-monospace,monospace;letter-spacing:.04em;cursor:pointer;transition:.18s}.code:hover{background:#21152f;border-color:#d8b4fe;transform:translateY(-2px)}.copy-hint{font-size:13px;color:#bca8d2;min-height:22px}p{color:#c9bfd5}a{display:inline-block;margin-top:16px;padding:11px 17px;border-radius:7px;background:#6f35b5;color:white;text-decoration:none;font-weight:800}</style></head>
<body><main><div class="eyebrow">ZGTHUB · HIDDEN EASTER EGG</div><h1>YOU GOT RICKROLLED. 🎵</h1><p>Secret code unlocked! Másold ki, majd a ZGTHUB „OG Style Code” részénél váltsd be.</p><button class="code" id="copySecretCode" type="button" aria-label="Secret kód másolása">oggetrickrolled</button><div class="copy-hint" id="copyHint" role="status" aria-live="polite">👆 Kattints a kódra a másoláshoz!</div><p>🎁 Jutalom: OG kinézet 30 napra. Egy böngészőn egyszer váltható be.</p><a href="./">Vissza a ZGTHUB-ra</a></main><script>
document.getElementById('copySecretCode').addEventListener('click',async function(){
 const hint=document.getElementById('copyHint');
 try{
  await navigator.clipboard.writeText('oggetrickrolled');
  hint.textContent='✅ Kód kimásolva! Most már beillesztheted.';
 }catch(error){
  hint.textContent='Jelöld ki a kódot, és másold ki kézzel: Ctrl+C';
 }
});
</script></body></html>
