<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZPhone Studio — Christmas Time! Part 2</title>
<style>
:root{--bg:#07150f;--panel:#10251a;--line:#31583d;--red:#c73546;--gold:#f1d27a;--green:#2b7548}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17452c,#07150f 60%);color:#fff8e9;font:15px system-ui, sans-serif;min-height:100vh}
header{padding:24px max(20px,calc((100% - 1050px)/2));border-bottom:1px solid #a83b48;background:#07150feF}
small,.muted{color:#b7cdbb}h1{margin:4px 0;font-size:clamp(25px,5vw,42px)}main{max-width:1050px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:linear-gradient(145deg,#173323,#0b1b12);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 32px #0004}
h2{margin:0 0 14px;color:var(--gold)}label{display:block;margin:12px 0 5px;color:#c6d9c8}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #45684e;background:#07150f;color:white;font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(120deg,#b42336,#176b3b 72%,#d6ad48);color:white;font-weight:800;cursor:pointer;margin-top:12px}
.phone-wrap{display:grid;place-items:center;min-height:340px}.phone{width:190px;height:330px;border:5px solid #d9c78a;border-radius:30px;background:linear-gradient(160deg,#183f2b,#07150f);padding:14px;box-shadow:0 0 0 3px #4a2d28,0 20px 45px #0008;display:flex;flex-direction:column;align-items:center}
.notch{width:62px;height:12px;border-radius:9px;background:#030806;margin-bottom:22px}.screen-brand{font-size:22px;font-weight:900}.wall{margin-top:20px;width:100%;height:145px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#e7c96b,#b92d3c 35%,#17452b 72%);display:grid;place-items:center;font-size:42px}
.apps{display:flex;gap:10px;margin-top:15px}.apps span{background:#ffffff20;border-radius:9px;padding:7px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.full{grid-column:1/-1}.saved{margin-top:12px;color:#a7e5ae}
@media(max-width:720px){main{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><small>🎄 CHRISTMAS TIME! PART 2 • GAME 01 + 03</small><h1>📱 ZPhone Studio</h1><div class="muted">Találd ki a saját telefonmárkádat, majd készíts hozzá saját operációs rendszert!</div></header>
<main>
<section class="panel">
<h2>1. Telefonmárka készítő</h2>
<label>Márkanév</label><input id="brand" maxlength="18" value="ZPhone" placeholder="Pl. ZPhone">
<label>Telefonmodell</label><input id="model" maxlength="22" value="ZPhone X1" placeholder="Pl. X1 Ultra">
<div class="row"><div><label>Kamera</label><select id="camera"><option>12 MP</option><option selected>50 MP</option><option>108 MP</option><option>200 MP</option></select></div><div><label>Akkumulátor</label><select id="battery"><option>4000 mAh</option><option selected>5000 mAh</option><option>6000 mAh</option><option>7000 mAh</option></select></div></div>
<label>Telefon színe</label><input id="phoneColor" type="color" value="#176b3b">
</section>
<section class="panel">
<h2>3. Saját operációs rendszer</h2>
<label>OS neve</label><input id="os" maxlength="18" value="ZOS" placeholder="Pl. ZOS">
<label>Verzió</label><input id="version" maxlength="12" value="1.0" placeholder="1.0">
<label>Háttérszín</label><input id="wallColor" type="color" value="#17452c">
<label>Rendszer stílusa</label><select id="style"><option>Modern</option><option>Minimal</option><option>Gamer</option><option>Christmas Edition</option></select>
<button id="apply">✨ Frissítés és előnézet</button><div class="saved" id="status" aria-live="polite">A saját rendszered készen áll a szerkesztésre.</div>
</section>
<section class="panel full">
<h2>📲 Élő telefon-előnézet</h2>
<div class="phone-wrap"><div class="phone" id="phone"><div class="notch"></div><div class="screen-brand" id="pbrand">ZPhone</div><div id="pmodel" class="muted">ZPhone X1</div><div class="wall" id="wall">❄️</div><div class="apps"><span>☎️</span><span>📷</span><span>⚙️</span></div><div style="margin-top:auto;font-weight:800" id="pos">ZOS 1.0</div></div></div>
<button id="save">💾 Saját telefonom mentése ezen az eszközön</button><div class="saved" id="saved"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function render(){ $('pbrand').textContent=$('brand').value||'MyPhone';$('pmodel').textContent=$('model').value||'My Model';$('pos').textContent=($('os').value||'MyOS')+' '+($('version').value||'1.0');$('wall').style.background='radial-gradient(circle at 50% 35%,#e7c96b,'+$('wallColor').value+' 72%)';$('phone').style.borderColor=$('phoneColor').value;$('wall').textContent=$('style').value==='Christmas Edition'?'🎄':'❄️';}
$('apply').addEventListener('click',()=>{render();$('status').textContent='✅ '+$('os').value+' '+$('version').value+' sikeresen elindult!';});
$('save').addEventListener('click',()=>{render();const data={brand:$('brand').value,model:$('model').value,camera:$('camera').value,battery:$('battery').value,phoneColor:$('phoneColor').value,os:$('os').value,version:$('version').value,wallColor:$('wallColor').value,style:$('style').value};localStorage.setItem('zphone-studio-save',JSON.stringify(data));$('saved').textContent='✅ Mentve! A telefonod beállításai ezen az eszközön megmaradnak.';});
['brand','model','camera','battery','phoneColor','os','version','wallColor','style'].forEach(id=>$(id).addEventListener('input',render));
try{const d=JSON.parse(localStorage.getItem('zphone-studio-save')||'null');if(d)Object.keys(d).forEach(k=>{if($(k))$(k).value=d[k];});}catch(e){}render();
</script></body></html>
