<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251a">
<title>404 — KÉSZÍTS KARÁCSONYFÁT! · ZGTHUB</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1b633a88,transparent 50%),linear-gradient(145deg,#07150f,#100d13);color:#fff8e9;font:16px/1.6 system-ui,Segoe UI,sans-serif;text-align:center;overflow-x:hidden}
main{width:min(760px,100%);padding:36px 24px;border:1px solid #b92d3c88;border-radius:24px;background:#10251add;box-shadow:0 24px 80px #0008}
.brand{font-weight:950;letter-spacing:.22em;color:#f6d36b;font-size:13px}.code{font-size:clamp(76px,17vw,140px);font-weight:1000;line-height:1;margin:18px 0;color:#f6d36b;text-shadow:0 0 32px #d6ad4844}
h1{font-size:clamp(26px,5vw,42px);margin:8px 0;color:#fff4dc}p{color:#c1d4c4;margin:8px auto;max-width:540px}
.tree{font-size:clamp(100px,22vw,170px);line-height:1.2;margin:12px 0;filter:drop-shadow(0 0 22px #e5c45a44);transition:transform .25s}
.decorations{min-height:38px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px auto 18px}
.ornament{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#7d172b;border:1px solid #f6d36b;font-size:16px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
button,a{font:inherit;font-weight:800;border:1px solid #e2c56b;border-radius:12px;padding:12px 18px;text-decoration:none;cursor:pointer}
button{background:linear-gradient(120deg,#b42336,#176b3b);color:white}a{background:#173323;color:#f6d36b}
button:hover,a:hover{transform:translateY(-2px);filter:brightness(1.12)}
small{display:block;color:#88a991;margin-top:28px;letter-spacing:.12em}
</style>
</head>
<body>
<main>
<div class="brand">ZGTHUB · CHRISTMAS TIME! PART 1</div>
<div class="code">404</div>
<h1>Hoppá! Ezt az oldalt nem találtuk.</h1>
<p>De ne menj még el — van egy karácsonyfánk, amit fel kell díszíteni!</p>
<div class="tree" id="tree" aria-label="Karácsonyfa">🎄</div>
<div class="decorations" id="decorations" aria-live="polite"></div>
<h2>KÉSZÍTS KARÁCSONYFÁT!</h2>
<p id="status">Nyomd meg a gombot, és díszítsd fel a fát!</p>
<div class="actions">
<button id="decorate" type="button">✨ Díszítés hozzáadása</button>
<a href="/">← Vissza a ZGTHUB-ra</a>
</div>
<small>ZGT NEVER DIES · ZND</small>
</main>
<script>
(function(){
 const items=["🔴","🟡","🔵","⭐","🎀","🟢","✨"];
 let count=0;
 const decorations=document.getElementById("decorations");
 const status=document.getElementById("status");
 document.getElementById("decorate").addEventListener("click",function(){
  if(count>=21){status.textContent="A karácsonyfa teljesen feldíszítve! Boldog karácsonyt! 🎄";return;}
  const item=document.createElement("span");
  item.className="ornament";
  item.textContent=items[count%items.length];
  decorations.appendChild(item);
  count++;
  document.getElementById("tree").style.transform="rotate("+((count%2?2:-2))+"deg) scale(1.02)";
  status.textContent="Díszek: "+count+" / 21 — még szebb lesz!";
  if(count===21)status.textContent="KÉSZ! A ZGTHUB karácsonyfája elkészült! 🎄";
 });
})();
</script>
<script>
(function(){
 const path=location.pathname.replace(/\/$/,'');
 const base=path.slice(0,path.lastIndexOf('/')+1);
 if(path.endsWith('/rickroll')){location.replace(base+'secret.html');return;}
 let typed='';
 document.addEventListener('keydown',function(e){if(e.ctrlKey||e.altKey||e.metaKey||e.key.length!==1)return;typed=(typed+e.key.toLowerCase()).slice(-8);if(typed==='rickroll')location.href=base+'secret.html';});
})();
</script>
</body>
</html>
