# Base44 sandbox environment for the ZGTHUB site.
#
# The project is a single static index.html (plain HTML/CSS/JS) with no build
# step and no dependencies, so the web service serves the cloned source
# directly from a bind mount instead of a prebuilt image. Any edit to the
# markup, styles or scripts is picked up on the next page refresh.
#
# Python's stdlib static server is used rather than nginx because nginx drops
# its workers to an unprivileged user, which cannot read the mode-700 checkout
# that is bind-mounted here.
#
# Run: docker compose -f docker-compose.base44.yml up -d

services:
  web:
    image: python:3.12-slim
    command:
      - python3
      - -m
      - http.server
      - "3000"
      - --bind
      - 0.0.0.0
      - --directory
      - /srv
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the checkout (read-only) as the document root.
      - ./:/srv:ro
    restart: on-failure
    healthcheck:
      # Probe the served page using the interpreter already in the image.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3)"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "ZGTHUB"
      base44.kind: "web"
      base44.port: "3000"
